[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flet-uth-background-sync"
version = "0.1.0"
description = "Native Android background Moodle synchronization service for UTHelper"
requires-python = ">=3.11"
dependencies = ["flet>=0.82.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/flet_uth_background_sync"]

[tool.hatch.build.targets.wheel.force-include]
"flutter/flet_uth_background_sync" = "flutter/flet_uth_background_sync"
