group = 'com.uthelper.backgroundsync'
version = '0.1.0'

buildscript {
    ext.kotlin_version = '2.4.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def uthDistributionChannel = (
    project.findProperty('uthDistributionChannel')
        ?: System.getenv('UTH_DISTRIBUTION_CHANNEL')
        ?: 'apk_lts'
).toString().trim().toLowerCase()
def isChplayChannel = (uthDistributionChannel == 'chplay')

android {
    namespace 'com.uthelper.backgroundsync'
    compileSdk 36

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main {
            if (isChplayChannel) {
                manifest.srcFile 'variants/chplay/AndroidManifest.xml'
                kotlin.srcDirs = ['src/main/kotlin', 'variants/chplay/kotlin']
                res.srcDirs = ['src/main/res']
            } else {
                kotlin.srcDirs = ['src/main/kotlin', 'variants/apk_lts/kotlin']
                res.srcDirs = ['src/main/res', 'variants/apk_lts/res']
            }
        }
        test {
            if (isChplayChannel) {
                kotlin.srcDirs = ['src/test/kotlin']
            } else {
                kotlin.srcDirs = ['src/test/kotlin', 'variants/apk_lts/test/kotlin']
            }
        }
    }

    if (isChplayChannel) {
        packaging {
            jniLibs {
                useLegacyPackaging = false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

tasks.configureEach {
    inputs.property('uthDistributionChannel', uthDistributionChannel)
}

tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

dependencies {
    if (project.hasProperty('flutterEmbeddingJar')) {
        compileOnly files(project.property('flutterEmbeddingJar'))
    }
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    kapt 'androidx.room:room-compiler:2.8.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
