[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flet-uth-quiz"
version = "0.1.0"
description = "Native Moodle quiz WebView control for UTHelper"
requires-python = ">=3.11"
dependencies = ["flet==0.86.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/flet_uth_quiz"]

[tool.hatch.build.targets.wheel.force-include]
"flutter/flet_uth_quiz" = "flutter/flet_uth_quiz"
