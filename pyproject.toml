[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uthelper"
version = "2.2.3"
description = "UTHelper — Ứng dụng theo dõi bài tập và deadline UTH E-learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ── Core (cross-platform) ──
    # HTTP: uses urllib.request (stdlib) — zero dependency, Cloudflare-friendly
    "certifi>=2024.2.2",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.6.4",
    "flet==0.86.5",
    "python-dateutil>=2.8.2",
    "packaging>=24.2",
    "sentry-sdk>=2,<3",
]

[project.optional-dependencies]
windows = [
    "flet[cli,desktop]==0.86.5",
    "pystray>=0.19.5",
    "pywin32>=306.0",
    "windows-toasts>=1.3.1",
    "winrt-Windows.ApplicationModel==3.2.1",
    "keyring>=25.0.0",
    "pillow>=12.3.0",
    "lxml>=6.1.0",
]
android-build = [
    "flet-android-notifications==0.10.0",
]

[project.scripts]
uth-alert = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flet]
org = "com.uthelper"
product = "UTHelper"
artifact = "UTHelper"
company = "UTHelper"
copyright = "Copyright (c) 2026"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.compile]
app = true
packages = true

# ── Android-specific configuration ──
[tool.flet.windows]
dependencies = [
    "pystray>=0.19.5",
    "pywin32>=306.0",
    "windows-toasts>=1.3.1",
    "winrt-Windows.ApplicationModel==3.2.1",
    "keyring>=25.0.0",
    "pillow>=12.3.0",
    "lxml>=6.1.0",
]

[tool.flet.android]
bundle_id = "com.uthelper.uthelper"
adaptive_icon_background = "#0F172A"
dependencies = [
    "flet-android-notifications==0.10.0",
    "flet-uth-background-sync==0.1.0",
]

[tool.flet.android.dev_packages]
flet-uth-background-sync = "extensions/flet_uth_background_sync"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.REQUEST_INSTALL_PACKAGES" = true  # Auto-update APK
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_DATA_SYNC" = true

# Android needs cleartext traffic for some Moodle instances
[tool.flet.android.manifest_application]
"usesCleartextTraffic" = "true"

# ── iOS-specific configuration ──
[tool.flet.ios]
bundle_id = "com.uthelper.UTHelper"
dependencies = ["flet-uth-background-sync==0.1.0"]

[tool.flet.ios.dev_packages]
flet-uth-background-sync = "extensions/flet_uth_background_sync"

[tool.flet.ios.info]
# Allow cleartext HTTP for Moodle instances without HTTPS
NSAppTransportSecurity = { NSAllowsArbitraryLoads = true }
# Permission descriptions (required by App Store)
NSUserNotificationsUsageDescription = "UTHelper cần quyền thông báo để nhắc deadline bài tập."

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-timeout>=2.3,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows_integration: isolated tests against real Windows user APIs",
]
