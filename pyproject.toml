[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uthelper"
version = "2.1.0"
description = "UTHelper — Ứng dụng theo dõi bài tập và deadline UTH E-learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ── Core (cross-platform, safe for Android build) ──
    "requests>=2.34.2",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "flet>=0.82.0",
    "python-dateutil>=2.8.2",
]

# Windows-specific packages - install with:
#   pip install "uthelper[windows]"
[project.optional-dependencies]
windows = [
    "pystray>=0.19.5",
    "pywin32>=306.0",
    "windows-toasts>=1.3.1",
    "keyring>=25.0.0",
    "pillow>=12.2.0",
    "lxml>=6.0.4",
]

[project.scripts]
uth-alert = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flet]
org = "com.uthelper"
product = "UTHelper"
artifact = "UTHelper"
company = "UTHelper"
copyright = "Copyright (c) 2026"

[tool.flet.app]
path = "src"
module = "main"

# ── Android-specific configuration ──
[tool.flet.android]
adaptive_icon_background = "#0F172A"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true

# Android needs cleartext traffic for some Moodle instances
[tool.flet.android.manifest_application]
"usesCleartextTraffic" = "true"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
