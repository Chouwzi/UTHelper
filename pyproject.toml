[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uthelper"
version = "2.1.0"
description = "UTHelper — Ứng dụng theo dõi bài tập và deadline UTH E-learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ── Core (cross-platform) ──
    "requests>=2.34.2",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "flet>=0.82.0",
    "pillow>=12.2.0",
    "lxml>=6.0.4",
    "python-dateutil>=2.8.2",

    # ── Windows-only ──
    "pystray>=0.19.5; sys_platform == 'win32'",
    "pywin32>=306.0; sys_platform == 'win32'",
    "windows-toasts>=1.3.1; sys_platform == 'win32'",
    "keyring>=25.0.0; sys_platform == 'win32'",
]

[project.scripts]
uth-alert = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flet]
org = "com.uthelper"
product = "UTHelper"
artifact = "UTHelper"
company = "UTHelper"
copyright = "Copyright (c) 2026"

[tool.flet.app]
path = "src"
module = "main"

# ── Android permissions ──
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
