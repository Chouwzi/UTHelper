[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uthelper"
version = "2.5.1"
description = "UTHelper — Ứng dụng theo dõi bài tập và deadline UTH E-learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ── Core (cross-platform) ──
    # HTTP: uses urllib.request (stdlib) — zero dependency, Cloudflare-friendly
    "certifi>=2024.2.2",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.28.1",
    "pydantic>=2.6.4",
    "flet==1.1.2",
    "python-dateutil>=2.8.2",
    "packaging>=24.2",
    "sentry-sdk>=2,<3",
    "pypdf>=7.1.1",
    "pillow>=13.0.0",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
windows = [
    "flet[cli,desktop]==1.1.2",
    "pystray>=0.19.5",
    "pywin32>=306.0",
    "windows-toasts>=1.3.1",
    "winrt-Windows.ApplicationModel==3.2.1",
    "webview2-Microsoft.Web.WebView2.Core==3.2.1",
    "keyring>=25.0.0",
    "lxml>=6.1.0",
    "pypdfium2>=5.9.0",
]
android-build = [
    "flet-android-notifications==0.10.0",
]

[project.scripts]
uth-alert = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flet]
org = "com.uthelper"
product = "UTHelper"
artifact = "UTHelper"
company = "UTHelper"
copyright = "Copyright (c) 2026"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.compile]
app = true
packages = true

[tool.flet.cleanup]
# Keep adjacent runtime bytecode; remove redundant build-time cache directories.
app = true

[tool.flet.flutter.pubspec.dependency_overrides]
# Flet 0.86.5's template pins 1.0.0; jni_flutter >=1.1.0 (published
# 2026-11-18) requires jni ^1.2.0 for JReference.nonNullPointer.
# https://github.com/flet-dev/flet/issues/6919
jni = "1.2.0"

# ── Windows-specific configuration ──
[tool.flet.windows]
dependencies = [
    "pystray>=0.19.5",
    "pywin32>=306.0",
    "windows-toasts>=1.3.1",
    "winrt-Windows.ApplicationModel==3.2.1",
    "webview2-Microsoft.Web.WebView2.Core==3.2.1",
    "keyring>=25.0.0",
    "lxml>=6.1.0",
    "pypdfium2>=5.9.0",
    "flet-uth-quiz==0.1.0",
]

[tool.flet.windows.dev_packages]
flet-uth-quiz = "extensions/flet_uth_quiz"

[tool.flet.windows.cleanup]
# PyWin32 compiled help is not used at runtime; retain every runtime module.
package_files = ["**.chm"]

# ── Android-specific configuration ──
[tool.flet.android]
legacy_packaging = true
bundle_id = "com.uthelper.uthelper"
adaptive_icon_background = "#0F172A"
target_sdk_version = 36
dependencies = [
    "flet-android-notifications==0.10.0",
    "flet-uth-background-sync==0.1.0",
    "flet-uth-quiz==0.1.0",
    "flet-webview==0.86.5",
]

[tool.flet.android.dev_packages]
flet-uth-background-sync = "extensions/flet_uth_background_sync"
flet-uth-quiz = "extensions/flet_uth_quiz"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.REQUEST_INSTALL_PACKAGES" = true  # Auto-update APK (apk_lts only; stripped for chplay)

# CH Play compliant: disallow external cleartext and backups; allow loopback HTTP only via network_security_config
[tool.flet.android.manifest_application]
"allowBackup" = "false"
"usesCleartextTraffic" = "false"
"networkSecurityConfig" = "@xml/network_security_config"

[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError"
"org.gradle.workers.max" = "2"
"kotlin.compiler.execution.strategy" = "in-process"
"kotlin.incremental" = "false"

# ── iOS-specific configuration ──
[tool.flet.ios]
bundle_id = "com.uthelper.UTHelper"
dependencies = [
    "flet-uth-background-sync==0.1.0",
    "flet-uth-quiz==0.1.0",
    "flet-webview==0.86.5",
]

[tool.flet.ios.dev_packages]
flet-uth-background-sync = "extensions/flet_uth_background_sync"
flet-uth-quiz = "extensions/flet_uth_quiz"

[tool.flet.ios.info]
# Allow cleartext HTTP for Moodle instances without HTTPS
NSAppTransportSecurity = { NSAllowsArbitraryLoads = true }
# Permission descriptions (required by App Store)
NSUserNotificationsUsageDescription = "UTHelper cần quyền thông báo để nhắc deadline bài tập và lịch học."

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-timeout>=2.3,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows_integration: isolated tests against real Windows user APIs",
]
