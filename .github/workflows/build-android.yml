name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build UTHelper Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Don't install Flutter separately - Flet manages its own SDK
      - name: Install Flet
        run: |
          pip install flet
          flet --version

      - name: Build APK
        run: |
          echo "🔨 Building UTHelper APK..."
          yes | flet build apk --verbose

      - name: List build output
        if: always()
        run: |
          echo "📦 Build artifacts:"
          find . -name "*.apk" 2>/dev/null | head -10
          ls -la build/apk/ 2>/dev/null || echo "No build/apk/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-Android-${{ github.sha }}
          path: build/apk/
          retention-days: 30
          if-no-files-found: warn
