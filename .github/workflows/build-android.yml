name: 📱 Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'apk'
        type: choice
        options: [apk, aab]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Flet CLI
        run: |
          pip install flet
          flet --version

      - name: 🔨 Build APK
        run: |
          BUILD_TYPE=${{ github.event.inputs.build_type || 'apk' }}
          echo "Building $BUILD_TYPE..."

          # First run: generates Flutter project but may fail due to desugaring
          yes | flet build $BUILD_TYPE --verbose 2>&1 || true

          # Find the app-level build file (Kotlin DSL or Groovy)
          echo "=== Searching for build files ==="
          find build/ -name "build.gradle*" -path "*/app/*" -type f 2>/dev/null
          
          BUILD_GRADLE=$(find build/ -name "build.gradle.kts" -path "*/app/*" -type f | head -1)
          if [ -z "$BUILD_GRADLE" ]; then
            BUILD_GRADLE=$(find build/ -name "build.gradle" -path "*/app/*" -type f | head -1)
          fi

          if [ -n "$BUILD_GRADLE" ]; then
            echo "✅ Found: $BUILD_GRADLE"
            
            # Detect syntax (Kotlin DSL vs Groovy)
            if [[ "$BUILD_GRADLE" == *.kts ]]; then
              echo "Using Kotlin DSL syntax..."
              # Add isCoreLibraryDesugaringEnabled
              if ! grep -q "isCoreLibraryDesugaringEnabled" "$BUILD_GRADLE"; then
                sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$BUILD_GRADLE"
              fi
              # Add desugaring dependency
              if ! grep -q "desugar_jdk_libs" "$BUILD_GRADLE"; then
                sed -i '/dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' "$BUILD_GRADLE"
              fi
              # Add multiDexEnabled
              if ! grep -q "multiDexEnabled" "$BUILD_GRADLE"; then
                sed -i '/defaultConfig {/a\        multiDexEnabled = true' "$BUILD_GRADLE"
              fi
            else
              echo "Using Groovy syntax..."
              if ! grep -q "isCoreLibraryDesugaringEnabled" "$BUILD_GRADLE"; then
                sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled true' "$BUILD_GRADLE"
              fi
              if ! grep -q "desugar_jdk_libs" "$BUILD_GRADLE"; then
                sed -i '/dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' "$BUILD_GRADLE"
              fi
              if ! grep -q "multiDexEnabled" "$BUILD_GRADLE"; then
                sed -i '/defaultConfig {/a\        multiDexEnabled true' "$BUILD_GRADLE"
              fi
            fi

            echo "✅ Patched successfully"
            grep -n "desugaring\|desugar\|multiDex" "$BUILD_GRADLE" || true
          else
            echo "❌ No build.gradle found, listing all gradle files:"
            find build/ -name "*.gradle*" -type f 2>/dev/null
            exit 1
          fi

          # Find flet's internal Flutter SDK and use it directly
          FLUTTER_BIN=$(find "$HOME" /opt -name "flutter" -path "*/bin/flutter" -type f 2>/dev/null | head -1)
          if [ -z "$FLUTTER_BIN" ]; then
            FLUTTER_BIN=$(find build/ -name "flutter" -path "*/bin/flutter" -type f 2>/dev/null | head -1)
          fi
          
          if [ -n "$FLUTTER_BIN" ]; then
            echo "✅ Found Flutter at: $FLUTTER_BIN"
            FLUTTER_PROJECT=$(dirname "$BUILD_GRADLE" | sed 's|/app$||' | sed 's|/android$||')
            echo "Flutter project: $FLUTTER_PROJECT"
            cd "$FLUTTER_PROJECT"
            "$FLUTTER_BIN" build $BUILD_TYPE --release
          else
            echo "⚠️ Flutter not found, retrying with flet build..."
            yes | flet build $BUILD_TYPE --verbose
          fi

      - name: 📋 List build outputs
        if: always()
        run: |
          echo "=== APK ==="
          find build/ -name "*.apk" -exec ls -lh {} \; 2>/dev/null
          echo "=== AAB ==="
          find build/ -name "*.aab" -exec ls -lh {} \; 2>/dev/null

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-Android-${{ github.sha }}
          path: |
            build/apk/*.apk
            build/aab/*.aab
            build/flutter/build/app/outputs/**/*.apk
            build/flutter/build/app/outputs/**/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: 🏷️ Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/apk/*.apk
            build/flutter/build/app/outputs/**/*.apk
          draft: true
          generate_release_notes: true
