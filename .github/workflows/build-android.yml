name: 📱 Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'apk'
        type: choice
        options: [apk, aab]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Flet CLI
        run: |
          pip install flet
          flet --version

      - name: 🔨 Build APK
        run: |
          BUILD_TYPE=${{ github.event.inputs.build_type || 'apk' }}
          echo "Building $BUILD_TYPE..."

          # Install Gradle init script for core library desugaring
          # This applies to ALL Android subprojects automatically,
          # without needing to patch any build.gradle.kts file
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/desugaring.gradle << 'INIT_GRADLE'
          allprojects {
              afterEvaluate {
                  if (project.hasProperty('android')) {
                      android {
                          compileOptions {
                              coreLibraryDesugaringEnabled true
                          }
                          defaultConfig {
                              multiDexEnabled true
                          }
                      }
                      dependencies {
                          coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
                      }
                  }
              }
          }
          INIT_GRADLE
          echo "✅ Installed Gradle init script for desugaring"

          # Build with flet (handles SERIOUS_PYTHON_SITE_PACKAGES and other env vars)
          yes | flet build $BUILD_TYPE --verbose

      - name: 📋 List build outputs
        if: always()
        run: |
          echo "=== APK ==="
          find build/ -name "*.apk" -exec ls -lh {} \; 2>/dev/null
          echo "=== AAB ==="
          find build/ -name "*.aab" -exec ls -lh {} \; 2>/dev/null

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-Android-${{ github.sha }}
          path: |
            build/apk/*.apk
            build/aab/*.aab
            build/flutter/build/app/outputs/**/*.apk
            build/flutter/build/app/outputs/**/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: 🏷️ Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/apk/*.apk
            build/flutter/build/app/outputs/**/*.apk
          draft: true
          generate_release_notes: true
