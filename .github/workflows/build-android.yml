name: 📱 Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'apk'
        type: choice
        options: [apk, aab]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Flet CLI
        run: |
          pip install flet
          flet --version

      - name: 🔨 Build APK
        run: |
          BUILD_TYPE=${{ github.event.inputs.build_type || 'apk' }}
          echo "Building $BUILD_TYPE..."

          # First run: generates Flutter project but may fail due to desugaring
          yes | flet build $BUILD_TYPE --verbose 2>&1 || true

          # Patch build.gradle for core library desugaring
          # (required by flutter_local_notifications)
          BUILD_GRADLE=$(find build/ -path "*/app/build.gradle" -type f | head -1)
          if [ -n "$BUILD_GRADLE" ]; then
            echo "Found build.gradle: $BUILD_GRADLE"
            echo "Patching for coreLibraryDesugaring..."

            # Add isCoreLibraryDesugaringEnabled in compileOptions
            if ! grep -q "isCoreLibraryDesugaringEnabled" "$BUILD_GRADLE"; then
              sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled true' "$BUILD_GRADLE"
            fi

            # Add desugaring dependency
            if ! grep -q "desugar_jdk_libs" "$BUILD_GRADLE"; then
              sed -i '/dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' "$BUILD_GRADLE"
            fi

            # Add multiDexEnabled
            if ! grep -q "multiDexEnabled" "$BUILD_GRADLE"; then
              sed -i '/defaultConfig {/a\        multiDexEnabled true' "$BUILD_GRADLE"
            fi

            echo "✅ Patched build.gradle"
            cat "$BUILD_GRADLE" | head -80
          else
            echo "⚠️ build.gradle not found, listing build dir..."
            find build/ -name "*.gradle" -type f 2>/dev/null
          fi

          # Second run: flet build with patched gradle (uses its own Flutter)
          echo "Re-running flet build with patched gradle..."
          yes | flet build $BUILD_TYPE --verbose

      - name: 📋 List build outputs
        if: always()
        run: |
          echo "=== APK ==="
          find build/ -name "*.apk" -exec ls -lh {} \; 2>/dev/null
          echo "=== AAB ==="
          find build/ -name "*.aab" -exec ls -lh {} \; 2>/dev/null

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-Android-${{ github.sha }}
          path: |
            build/apk/*.apk
            build/aab/*.aab
            build/flutter/build/app/outputs/**/*.apk
            build/flutter/build/app/outputs/**/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: 🏷️ Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/apk/*.apk
            build/flutter/build/app/outputs/**/*.apk
          draft: true
          generate_release_notes: true
