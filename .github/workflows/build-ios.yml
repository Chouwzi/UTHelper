name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:  # Cho phép chạy thủ công từ Actions tab

jobs:
  build-ipa:
    name: Build UTHelper iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. Install Flet CLI ──
      - name: Install Flet
        run: |
          pip install flet
          flet --version

      # ── 4. Install Flutter SDK (Flet sẽ tự tải nếu chưa có) ──
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ── 5. Build UNSIGNED IPA ──
      # Dùng cho test cá nhân qua AltStore/Sideloadly
      - name: Build IPA (unsigned)
        run: |
          echo "🔨 Building UTHelper IPA..."
          flet build ipa --no-codesign --verbose
        env:
          PUB_CACHE: ${{ github.workspace }}/.pub-cache

      # ── 6. Find and list output ──
      - name: List build output
        run: |
          echo "📦 Build artifacts:"
          find build/ -name "*.ipa" -o -name "*.app" 2>/dev/null || true
          ls -la build/ipa/ 2>/dev/null || echo "No build/ipa/ directory"

      # ── 7. Upload artifact ──
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-iOS-${{ github.sha }}
          path: |
            build/ipa/
            build/ios/
          retention-days: 30
          if-no-files-found: warn
