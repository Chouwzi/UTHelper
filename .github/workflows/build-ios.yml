name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build UTHelper iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: |
          pip install flet
          flet --version

      # Flet builds xcarchive (unsigned, no codesign)
      - name: Build with Flet
        run: |
          echo "🔨 Building UTHelper..."
          yes | flet build ipa --verbose

      # Convert xcarchive to IPA manually
      - name: Package xcarchive as IPA
        run: |
          echo "📦 Converting xcarchive to IPA..."
          
          # Find the .xcarchive
          XCARCHIVE=$(find build/ -name "*.xcarchive" -type d | head -1)
          if [ -z "$XCARCHIVE" ]; then
            echo "❌ No .xcarchive found"
            find build/ -type d -maxdepth 4 2>/dev/null
            exit 1
          fi
          echo "Found: $XCARCHIVE"
          
          # Find the .app inside xcarchive
          APP_PATH="$XCARCHIVE/Products/Applications"
          APP=$(find "$APP_PATH" -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            echo "❌ No .app found in xcarchive"
            ls -la "$XCARCHIVE/Products/" 2>/dev/null
            exit 1
          fi
          echo "Found app: $APP"
          
          # Create Payload structure and zip as IPA
          mkdir -p output/Payload
          cp -r "$APP" output/Payload/
          cd output
          zip -r -q UTHelper.ipa Payload
          
          echo "✅ IPA created!"
          ls -lh UTHelper.ipa

      - name: List all outputs
        if: always()
        run: |
          echo "=== xcarchive ==="
          find build/ -name "*.xcarchive" -type d 2>/dev/null
          echo "=== IPA ==="
          find . -name "*.ipa" 2>/dev/null
          echo "=== app ==="
          find build/ -name "*.app" -type d 2>/dev/null | head -5

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-iOS-${{ github.sha }}
          path: output/UTHelper.ipa
          retention-days: 30
          if-no-files-found: error

      # Also upload xcarchive for Xcode re-signing
      - name: Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-xcarchive-${{ github.sha }}
          path: build/ipa/
          retention-days: 30
          if-no-files-found: warn
