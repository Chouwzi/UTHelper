name: 🍎 Build iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Flet CLI
        run: |
          pip install flet
          flet --version

      - name: 🔨 Build IPA (unsigned)
        run: |
          echo "Building UTHelper for iOS..."
          yes | flet build ipa --verbose

      - name: 📦 Package xcarchive → IPA
        run: |
          XCARCHIVE=$(find build/ -name "*.xcarchive" -type d | head -1)
          if [ -z "$XCARCHIVE" ]; then
            echo "❌ No .xcarchive found"
            find build/ -type d -maxdepth 4 2>/dev/null
            exit 1
          fi
          echo "✅ Found: $XCARCHIVE"

          # Find .app inside xcarchive
          APP=$(find "$XCARCHIVE/Products/Applications" -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            echo "❌ No .app found"
            exit 1
          fi
          echo "✅ App: $APP"

          # Create IPA from Payload
          mkdir -p output/Payload
          cp -r "$APP" output/Payload/
          cd output
          zip -r -q UTHelper.ipa Payload
          echo "✅ IPA created: $(ls -lh UTHelper.ipa | awk '{print $5}')"

      - name: 📋 List outputs
        if: always()
        run: |
          echo "=== xcarchive ==="
          find build/ -name "*.xcarchive" -type d 2>/dev/null
          echo "=== IPA ==="
          find . -name "*.ipa" -exec ls -lh {} \; 2>/dev/null

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-iOS-${{ github.sha }}
          path: output/UTHelper.ipa
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-xcarchive-${{ github.sha }}
          path: build/ipa/
          retention-days: 30
          if-no-files-found: warn
