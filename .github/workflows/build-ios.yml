name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build UTHelper iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Don't install Flutter separately - Flet manages its own Flutter SDK
      - name: Install Flet
        run: |
          pip install flet
          flet --version

      # Use 'yes' to auto-confirm Flutter SDK install prompt
      - name: Build IPA
        run: |
          echo "🔨 Building UTHelper IPA..."
          yes | flet build ipa --verbose

      - name: List build output
        if: always()
        run: |
          echo "📦 Build artifacts:"
          find . -name "*.ipa" -o -name "*.app" 2>/dev/null | head -20
          ls -la build/ipa/ 2>/dev/null || echo "No build/ipa/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-iOS-${{ github.sha }}
          path: build/ipa/
          retention-days: 30
          if-no-files-found: warn
