name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build UTHelper iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flet
        run: |
          pip install flet
          flet --version

      # Flet build generates a Flutter project, then builds it
      # For unsigned IPA: let flet create project, then use flutter directly
      - name: Create Flutter project with Flet
        run: |
          echo "🔨 Creating Flutter project..."
          # flet build ios will fail at codesign but creates the project
          flet build ios --verbose 2>&1 || true
          echo "📂 Looking for generated Flutter project..."
          find . -name "pubspec.yaml" -not -path "./.pub-cache/*" -not -path "*/flutter/*" 2>/dev/null || true

      - name: Build unsigned iOS release
        run: |
          # Find the Flutter project generated by flet
          PUBSPEC=$(find . -name "pubspec.yaml" -path "*/build/*" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ No pubspec.yaml found in build/"
            echo "Listing build directory:"
            ls -la build/ 2>/dev/null || echo "No build/ dir"
            find . -name "pubspec.yaml" 2>/dev/null
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "📂 Flutter project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "🔨 Building unsigned iOS release..."
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          echo "📦 Packaging unsigned IPA..."
          # Find Runner.app from the Flutter build output
          APP_PATH=$(find . -name "Runner.app" -path "*/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -path "*/iphoneos/*" | head -1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "✅ Found app: $APP_PATH"
            mkdir -p output/Payload
            cp -r "$APP_PATH" output/Payload/
            cd output
            zip -r UTHelper-unsigned.ipa Payload
            echo "✅ IPA created!"
            ls -la UTHelper-unsigned.ipa
          else
            echo "❌ No .app bundle found"
            find . -name "*.app" 2>/dev/null || echo "No .app files"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-iOS-${{ github.sha }}
          path: output/UTHelper-unsigned.ipa
          retention-days: 30
          if-no-files-found: warn
