name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build UTHelper iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flet
        run: |
          pip install flet
          flet --version
          flutter --version

      # Step 1: flet build to generate Flutter project
      - name: Generate Flutter project
        run: |
          echo "🔨 Generating Flutter project from Flet..."
          flet build ios --verbose 2>&1 || true
          # Even if flet build fails at signing, Flutter project is created

      # Step 2: Build unsigned with flutter directly
      - name: Build unsigned iOS app
        run: |
          echo "🔨 Building unsigned iOS release..."
          # Find the generated Flutter project
          FLUTTER_DIR=$(find . -name "Runner.xcworkspace" -path "*/ios/*" | head -1 | xargs dirname | xargs dirname)
          if [ -z "$FLUTTER_DIR" ]; then
            echo "Flutter project not found, trying build/flutter..."
            FLUTTER_DIR="build"
          fi
          echo "Flutter dir: $FLUTTER_DIR"
          
          cd "$FLUTTER_DIR" 2>/dev/null || true
          flutter build ios --release --no-codesign --verbose

      # Step 3: Package as IPA
      - name: Package IPA
        run: |
          echo "📦 Packaging unsigned IPA..."
          APP_PATH=$(find build/ -name "Runner.app" -path "*/iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -path "*/iphoneos/*" | head -1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "Found app: $APP_PATH"
            mkdir -p build/ipa/Payload
            cp -r "$APP_PATH" build/ipa/Payload/
            cd build/ipa
            zip -r ../UTHelper-unsigned.ipa Payload
            echo "✅ IPA created: build/UTHelper-unsigned.ipa"
            ls -la ../UTHelper-unsigned.ipa
          else
            echo "❌ No .app found"
            find build/ -name "*.app" 2>/dev/null || echo "No .app files anywhere"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UTHelper-iOS-${{ github.sha }}
          path: build/UTHelper-unsigned.ipa
          retention-days: 30
          if-no-files-found: warn
