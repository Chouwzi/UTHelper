name: Release Android and Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e . pytest ruff
      - run: ruff check src tests
      - run: python -m pytest tests -q --tb=short
      - id: version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be numeric X.Y.Z, got $VERSION"
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -e ".[android-build]"
      - name: Build and patch Android notifications
        shell: bash
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          python scripts/generate_public_runtime_config.py --sentry-dsn "$SENTRY_DSN" --output src/assets/diagnostics-config.json
          yes | flet build apk --verbose || test -d build/flutter
          flet-android-notifications-patch --project-root build/flutter
          python scripts/generate_public_runtime_config.py --sentry-dsn "$SENTRY_DSN" --output src/assets/diagnostics-config.json
          yes | flet build apk --verbose
          MANIFEST=build/flutter/android/app/src/main/AndroidManifest.xml
          grep -q "ScheduledNotificationReceiver" "$MANIFEST"
          grep -q "ScheduledNotificationBootReceiver" "$MANIFEST"
          grep -q "ActionBroadcastReceiver" "$MANIFEST"
          grep -q "DeadlineAlarmReceiver" "$MANIFEST"
          grep -q "RescheduleReceiver" "$MANIFEST"
          grep -R -q "androidx.work:work-runtime-ktx:2.11.2" \
            build/flutter/flutter-packages/flet_uth_background_sync/android/build.gradle
          grep -R -q "androidx.room:room-runtime:2.8.4" \
            build/flutter/flutter-packages/flet_uth_background_sync/android/build.gradle
      - name: Sign release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$EXPECTED_CERT_SHA256"
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          mapfile -t APK_CANDIDATES < <(find build/apk -maxdepth 1 -name '*.apk' -type f | sort)
          if [ "${#APK_CANDIDATES[@]}" -ne 1 ]; then
            echo "Expected exactly one Flet release APK in build/apk, found ${#APK_CANDIDATES[@]}"
            printf '%s\n' "${APK_CANDIDATES[@]}"
            exit 1
          fi
          APK="${APK_CANDIDATES[0]}"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs aligned.apk | tee apk-signature.txt
          ACTUAL_CERT_SHA256=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-signature.txt | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_CERT_SHA256=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL_CERT_SHA256" && test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          FINAL_APK="UTHelper-${{ needs.validate.outputs.version }}.apk"
          mv aligned.apk "$FINAL_APK"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER"
          test "$($APKANALYZER manifest application-id "$FINAL_APK")" = "com.uthelper.UTHelper"
          test "$($APKANALYZER manifest version-name "$FINAL_APK")" = "${{ needs.validate.outputs.version }}"
          "$APKANALYZER" manifest print "$FINAL_APK" > final-android-manifest.xml
          grep -q "ScheduledNotificationReceiver" final-android-manifest.xml
          grep -q "ScheduledNotificationBootReceiver" final-android-manifest.xml
          grep -q "ActionBroadcastReceiver" final-android-manifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: UTHelper-${{ needs.validate.outputs.version }}.apk
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e ".[windows]"
      - name: Generate public diagnostics config and build Windows bundle
        shell: pwsh
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          python scripts/generate_public_runtime_config.py --sentry-dsn "$env:SENTRY_DSN" --output src/assets/diagnostics-config.json
          if ($LASTEXITCODE -ne 0) { throw "Diagnostics config generation failed" }
          flet build windows --output dist\flet-build --verbose
      - name: Prepare Flet Windows bundle
        run: python scripts\prepare_windows_bundle.py dist\flet-build
      - name: Verify Flet Windows bundle
        run: python scripts\verify_windows_bundle.py dist\flet-build
      - name: Decode Windows signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw "WINDOWS_PFX_BASE64 is required" }
          [IO.File]::WriteAllBytes("release.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
      - name: Package signed MSIX and AppInstaller
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          MSIX_PUBLISHER: ${{ secrets.WINDOWS_MSIX_PUBLISHER }}
          EXPECTED_CERT_SHA256: ${{ secrets.WINDOWS_SIGNING_CERT_SHA256 }}
        run: |
          if (-not $env:MSIX_PUBLISHER -or -not $env:EXPECTED_CERT_SHA256) {
            throw "WINDOWS_MSIX_PUBLISHER and WINDOWS_SIGNING_CERT_SHA256 are required"
          }
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            (Resolve-Path release.pfx).Path,
            $env:PFX_PASSWORD,
            $flags
          )
          $actualThumbprint = $certificate.GetCertHashString(
            [Security.Cryptography.HashAlgorithmName]::SHA256
          ).Replace(":", "").ToUpperInvariant()
          $expectedThumbprint = $env:EXPECTED_CERT_SHA256.Replace(":", "").Replace(" ", "").ToUpperInvariant()
          if ($actualThumbprint -ne $expectedThumbprint) {
            throw "Windows signing certificate fingerprint does not match the pinned release certificate"
          }
          $version = "${{ needs.validate.outputs.version }}"
          $version4 = "$version.0"
          .\scripts\package_msix.ps1 -BundleDir dist\flet-build -Version $version4 `
            -Publisher $env:MSIX_PUBLISHER -Output "UTHelper-$version-x64.msix" `
            -CertificatePath release.pfx -CertificatePassword $env:PFX_PASSWORD
          .\scripts\generate_appinstaller.ps1 -Version $version `
            -Publisher $env:MSIX_PUBLISHER -Repository "${{ github.repository }}" `
            -Output UTHelper.appinstaller

          [xml]$packageManifest = Get-Content -Raw build\msix-stage\AppxManifest.xml
          $identity = $packageManifest.Package.Identity
          if ($identity.Name -ne "com.uthelper.UTHelper" -or
              $identity.Publisher -ne $env:MSIX_PUBLISHER -or
              $identity.Version -ne $version4 -or
              $identity.ProcessorArchitecture -ne "x64") {
            throw "Packaged MSIX identity does not match release metadata"
          }
          [xml]$appInstaller = Get-Content -Raw UTHelper.appinstaller
          if ($appInstaller.AppInstaller.MainPackage.Version -ne $version4 -or
              $appInstaller.AppInstaller.MainPackage.Publisher -ne $env:MSIX_PUBLISHER) {
            throw "AppInstaller metadata does not match the signed MSIX"
          }
          $signature = Get-AuthenticodeSignature "UTHelper-$version-x64.msix"
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "MSIX Authenticode signature is not trusted: $($signature.StatusMessage)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            UTHelper-${{ needs.validate.outputs.version }}-x64.msix
            UTHelper.appinstaller
          if-no-files-found: error

  publish:
    needs: [validate, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate verified release manifest
        run: |
          python scripts/generate_release_manifest.py \
            --version "${{ needs.validate.outputs.version }}" \
            --repository "${{ github.repository }}" \
            --android "release/UTHelper-${{ needs.validate.outputs.version }}.apk" \
            --windows "release/UTHelper.appinstaller" \
            --minimum-supported-version "2.1.0" \
            --output release/release-manifest.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/*
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: release

  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy AppInstaller and release metadata
        id: deployment
        uses: actions/deploy-pages@v4
