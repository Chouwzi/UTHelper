name: Build Microsoft Store MSIX

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: Partner Center MSIX Identity Name (defaults to vars.MSSTORE_IDENTITY_NAME or com.uthelper.UTHelper)
        required: false
        type: string
        default: ''
      publisher:
        description: Partner Center MSIX Publisher DN (defaults to vars.MSSTORE_PUBLISHER or CN=UTHelper)
        required: false
        type: string
        default: ''
      store_product_id:
        description: Optional Microsoft Store ProductId for deep links (defaults to vars.MSSTORE_PRODUCT_ID)
        required: false
        type: string
        default: ''
      sign_mode:
        description: MSIX signing mode (none for Partner Center upload, test for self-signed sideload)
        required: false
        type: choice
        default: none
        options:
          - none
          - test
      run_wack:
        description: Run Windows App Certification Kit (appcert.exe) against the packaged MSIX
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [develop, main]
    paths:
      - 'extensions/flet_uth_quiz/**'
      - 'pyproject.toml'
      - 'scripts/package_msix.ps1'
      - 'scripts/verify_msix_release.ps1'
      - 'scripts/generate_msix_assets.py'
      - 'scripts/prepare_windows_bundle.py'
      - 'scripts/verify_windows_bundle.py'
      - '.github/workflows/build-msstore.yml'
      - 'src/core/distribution.py'
      - 'src/assets/icon.png'

concurrency:
  group: build-msstore-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-msstore-msix:
    name: Build and verify Microsoft Store MSIX
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Windows packaging dependencies
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip install -e ".[windows]"
          if ($LASTEXITCODE -ne 0) { throw "Windows dependency installation failed" }

      - name: Prepare reviewed Flet diagnostics template
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $support = "build/support"
          $source = "$support/flet-build-template-0.86.5.zip"
          $download = "$source.download"
          $expected = "8f95dc20ef6d901d9b5ee59f00e33d19f1d2bc6be8d6d3b800c4aab3d7315b73"
          New-Item -ItemType Directory -Path $support -Force | Out-Null
          try {
            Invoke-WebRequest -Uri "https://github.com/flet-dev/flet/releases/download/v0.86.5/flet-build-template.zip" -OutFile $download -TimeoutSec 30
            $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Downloaded Flet template hash changed" }
            Move-Item -LiteralPath $download -Destination $source -Force
          } finally {
            Remove-Item -LiteralPath $download -Force -ErrorAction SilentlyContinue
          }
          python scripts/prepare_flet_diagnostics_template.py --source build/support/flet-build-template-0.86.5.zip --output build/support/flet-build-template-0.86.5-diagnostics.zip
          if ($LASTEXITCODE -ne 0) { throw "Flet diagnostics template preparation failed" }

      - name: Build and verify Windows application bundle
        timeout-minutes: 35
        shell: pwsh
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (python scripts/release_metadata.py --pyproject pyproject.toml --print-version).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Version resolution failed" }
          $buildNumber = (python -c "from pathlib import Path; from scripts.release_metadata import read_project_version, release_build_number; print(release_build_number(read_project_version(Path('pyproject.toml'))))").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $buildNumber) { throw "Build number resolution failed" }
          "MSSTORE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          python scripts/release_metadata.py --pyproject pyproject.toml --runtime-output src/assets/release-version
          if ($LASTEXITCODE -ne 0) { throw "Runtime version generation failed" }
          python scripts/generate_public_runtime_config.py --sentry-dsn "$env:SENTRY_DSN" --output src/assets/diagnostics-config.json
          if ($LASTEXITCODE -ne 0) { throw "Diagnostics config generation failed" }
          flet build windows --build-version "$version" --build-number "$buildNumber" --template build/support/flet-build-template-0.86.5-diagnostics.zip --yes --verbose
          if ($LASTEXITCODE -ne 0) { throw "Flet Windows build failed" }
          python scripts/verify_flutter_diagnostics.py --template build/support/flet-build-template-0.86.5-diagnostics.zip --project-root build/flutter
          if ($LASTEXITCODE -ne 0) { throw "Generated Flutter diagnostics verification failed" }
          python scripts/prepare_windows_bundle.py build/windows
          if ($LASTEXITCODE -ne 0) { throw "Windows bundle preparation failed" }
          python scripts/verify_windows_bundle.py build/windows --expected-version "$version"
          if ($LASTEXITCODE -ne 0) { throw "Windows bundle verification failed" }

      - name: Package and verify Microsoft Store MSIX
        timeout-minutes: 20
        shell: pwsh
        env:
          INPUT_IDENTITY_NAME: ${{ inputs.identity_name }}
          INPUT_PUBLISHER: ${{ inputs.publisher }}
          INPUT_STORE_PRODUCT_ID: ${{ inputs.store_product_id }}
          INPUT_SIGN_MODE: ${{ inputs.sign_mode }}
          INPUT_RUN_WACK: ${{ inputs.run_wack }}
          VAR_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          VAR_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          VAR_STORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:MSSTORE_VERSION
          $msixVersion = "$version.0"

          $identityName = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_IDENTITY_NAME)) {
            $env:INPUT_IDENTITY_NAME.Trim()
          } elseif (-not [string]::IsNullOrWhiteSpace($env:VAR_IDENTITY_NAME)) {
            $env:VAR_IDENTITY_NAME.Trim()
          } else {
            "com.uthelper.UTHelper"
          }

          $publisher = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_PUBLISHER)) {
            $env:INPUT_PUBLISHER.Trim()
          } elseif (-not [string]::IsNullOrWhiteSpace($env:VAR_PUBLISHER)) {
            $env:VAR_PUBLISHER.Trim()
          } else {
            "CN=UTHelper"
          }

          $storeProductId = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_STORE_PRODUCT_ID)) {
            $env:INPUT_STORE_PRODUCT_ID.Trim()
          } elseif (-not [string]::IsNullOrWhiteSpace($env:VAR_STORE_PRODUCT_ID)) {
            $env:VAR_STORE_PRODUCT_ID.Trim()
          } else {
            ""
          }

          $signMode = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_SIGN_MODE)) {
            $env:INPUT_SIGN_MODE.Trim()
          } else {
            "none"
          }

          New-Item -ItemType Directory -Path dist, evidence -Force | Out-Null
          $outputMsix = "dist/UTHelper-$version-msstore.msix"
          $evidenceJson = "evidence/UTHelper-$version-msstore.msix.verification.json"

          $packArgs = @{
            BundleDir    = "build/windows"
            Version      = $msixVersion
            IdentityName = $identityName
            Publisher    = $publisher
            Channel      = "msstore"
            SignMode     = $signMode
            Output       = $outputMsix
          }
          if (-not [string]::IsNullOrWhiteSpace($storeProductId)) {
            $packArgs.StoreProductId = $storeProductId
          }
          ./scripts/package_msix.ps1 @packArgs

          $verifyArgs = @{
            MsixPath     = $outputMsix
            Channel      = "msstore"
            IdentityName = $identityName
            Publisher    = $publisher
            Version      = $msixVersion
            Output       = $evidenceJson
          }
          if (-not [string]::IsNullOrWhiteSpace($storeProductId)) {
            $verifyArgs.StoreProductId = $storeProductId
          }
          ./scripts/verify_msix_release.ps1 @verifyArgs

          if ($env:INPUT_RUN_WACK -eq "true") {
            $wackMsix = $outputMsix
            $wackTempDir = $null
            $importedThumbprint = $null
            try {
              if ($signMode -eq "none") {
                $wackTempDir = "build/wack"
                New-Item -ItemType Directory -Path $wackTempDir -Force | Out-Null
                $wackMsix = "$wackTempDir/UTHelper-$version-msstore-wack.msix"
                $wackPackArgs = @{
                  BundleDir    = "build/windows"
                  Version      = $msixVersion
                  IdentityName = $identityName
                  Publisher    = $publisher
                  Channel      = "msstore"
                  SignMode     = "test"
                  Output       = $wackMsix
                }
                if (-not [string]::IsNullOrWhiteSpace($storeProductId)) {
                  $wackPackArgs.StoreProductId = $storeProductId
                }
                ./scripts/package_msix.ps1 @wackPackArgs
              }

              $cerPath = $wackMsix + ".test-cert.cer"
              if (Test-Path -LiteralPath $cerPath -PathType Leaf) {
                $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($cerPath)
                $importedThumbprint = $cert.Thumbprint
                & certutil.exe -f -addstore Root $cerPath
                if ($LASTEXITCODE -ne 0) { throw "Failed to trust test certificate for WACK" }
              }

              $wackVerifyArgs = @{
                MsixPath       = $wackMsix
                Channel        = "msstore"
                IdentityName   = $identityName
                Publisher      = $publisher
                Version        = $msixVersion
                RunWack        = $true
                WackReportPath = "evidence/UTHelper-$version-msstore.wack-report.xml"
              }
              if (-not [string]::IsNullOrWhiteSpace($storeProductId)) {
                $wackVerifyArgs.StoreProductId = $storeProductId
              }
              ./scripts/verify_msix_release.ps1 @wackVerifyArgs
            } finally {
              if ($importedThumbprint) {
                & certutil.exe -delstore Root $importedThumbprint | Out-Null
              }
              if ($wackTempDir -and (Test-Path -LiteralPath $wackTempDir)) {
                Remove-Item -LiteralPath $wackTempDir -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Upload Microsoft Store MSIX and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 5
        with:
          name: msstore-msix-${{ env.MSSTORE_VERSION }}-${{ github.sha }}
          path: |
            dist/UTHelper-${{ env.MSSTORE_VERSION }}-msstore.msix
            evidence/UTHelper-${{ env.MSSTORE_VERSION }}-msstore.msix.verification.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload WACK certification report
        if: ${{ (success() || failure()) && inputs.run_wack }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 5
        with:
          name: msstore-wack-report-${{ env.MSSTORE_VERSION }}-${{ github.sha }}
          path: evidence/UTHelper-${{ env.MSSTORE_VERSION }}-msstore.wack-report.xml
          retention-days: 30
          if-no-files-found: warn
